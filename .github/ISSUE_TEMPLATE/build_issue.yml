name: Build Issue
description: Report a compilation or CMake problem
title: "[BUILD] "
labels: ["build"]
body:
  - type: dropdown
    id: build-tier
    attributes:
      label: Build Tier
      description: >-
        Which build tier are you targeting? See
        [AGENTS.md](AGENTS.md#9-build-system-quick-reference)
        for tier definitions.
      options:
        - Engine (-DUSE_COREMODS=OFF -DUSE_CLI=OFF)
        - Core (-DUSE_CLI=OFF -DUSE_CFITSIO=OFF)
        - Core+FITS (-DUSE_CLI=OFF)
        - Full (defaults)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: cmake-invocation
    attributes:
      label: CMake Invocation
      description: >-
        Paste the exact cmake command you ran.
      placeholder: |
        cmake .. -DCMAKE_INSTALL_PREFIX=...
      render: bash
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error Output
      description: >-
        Paste the relevant compiler or CMake error
        output. AI agents can use the
        `diagnose-build-failure` skill to triage
        these errors.
      render: text
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: System information.
      value: |
        - OS:
        - Compiler + version:
        - CMake version:
        - Branch:
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: >-
            I ran cmake from a clean _build directory
          required: true
        - label: >-
            I am building from the `framework-dev`
            branch (or a branch derived from it)
          required: true
        - label: I searched existing issues for duplicates
          required: true
