name: Doxygen API Reference

on:
  push:
    branches:
      - main
      - master
      - dev
      - framework-dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Check for Doxyfile
        id: check_doxyfile
        run: |
          if [ -f "Doxyfile" ]; then
            echo "has_doxyfile=true" >> $GITHUB_ENV
          else
            echo "has_doxyfile=false" >> $GITHUB_ENV
            echo "Warning: Doxyfile not found. Please create one to generate API documentation."
          fi

      - name: Build Doxygen documentation
        if: env.has_doxyfile == 'true'
        run: doxygen Doxyfile

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && env.has_doxyfile == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/doxygen/html
          publish_branch: gh-pages
          commit_message: "docs(doxygen): update API documentation"
  
