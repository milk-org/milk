site_name: milk Documentation
site_url: https://milk-org.github.io/milk/
repo_url: https://github.com/milk-org/milk
repo_name: milk-org/milk

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

docs_dir: docs

nav:
  - Home: index.md
  - Getting Started:
    - Installation: install/compile.md
    - Build Tiers: install/build_tiers.md
    - CLI Overview: cli/CLI_Overview.md
  - Core Concepts:
    - Streams: streams.md
    - FPS: fps.md
    - Process Info: procinfo.md
  - Architecture:
    - Overview: architecture.md
    - "Programmer's Guide": programmers_guide.md
    - Dependency Graph: dependency_graph.md
    - FPS Standalone Modes: FPS_Standalone_CMD_Modes.md
  - Developer:
    - Tutorial: developer/tutorial.md
    - Coding Standards: developer/coding_standards.md
    - Adding Plugins: developer/plugins.md
    - Template Source Code: developer/TemplateSourceCode.md
    - Module Files: developer/ModuleFiles.md
    - Loading Modules: developer/LoadingModules.md
    - Documenting Code: developer/DocumentingCode.md
    - Working with Git: developer/WorkingWithGit.md
  - Tools & Reference:
    - CLI Syntax: cli/CLIcore.md
    - Readline Keys: cli/helpreadline.md
    - Scripts: scripts.md
    - Python API: python.md
    - Valkey Integration: valkey.md
  - Operations:
    - Performance Tuning: performance.md
    - PGO & LTO: pgo.md
    - Debugging: debugging.md
  - FAQ: faq.md
  - Code Assist: code_assist.md
  - API Reference (Doxygen): api/html/index.html

markdown_extensions:
  - admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/milk-org/milk
