[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=58", "wheel", 'cmake']

[project]
authors = [
  {name = "Vincent Deo", email = "vdeo@naoj.org"},
]
description = "MOKA (Milk OrKestrAtion): MILK+CACAO pipelines python package"
name = "moka"
version = "1.0"
requires-python = ">=3.11"
dependencies = ["tomli>=2.4", "tomli_w>=1.2", "pydantic>=2.12", "click>=8.1", "matplotlib", "ipdb"]

#[project.urls]
#"Homepage" = "http://www.github.com/milk-org/pyMilk"

## ENTRYPOINTS

[project.scripts]
moka = "moka.operate.cli:moka"
mokainit = "moka.provision.cli:mokainit"
mokashow = "moka.show.cli:mokashow"

[tool.setuptools.packages.find]
include=["moka*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--import-mode=importlib",
    "--basetemp=/tmp/moka_pytest",  # static, wiped each run (pytest default: pytest-of-$USER/pytest-N)
    "--ignore=tests/mains",
    "--ignore=pyMilk",
    "--ignore=specs",
    # Unused by moka tests; they add Flask/Jinja2 and IPython-stack imports at startup.
    "-p", "no:dash",
    "-p", "no:returns",
    "-p", "no:anyio",
    "-m", "not e2e",  # a -m on the command line replaces this one: `pytest -m e2e`
]
markers = ["e2e: long end-to-end runs; not in the default suite"]

[tool.coverage.run]
command_line = "-m pytest"
branch = true
source = ["./moka"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    'TYPE_CHECKING:',
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
ignore_errors = true
omit = ["tests/*", "setup.py", "pyMilk/*"]
