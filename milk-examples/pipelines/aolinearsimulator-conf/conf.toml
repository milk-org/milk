# [config] # TODO nesting of top-level params.
long_name = "aolinearsimulator"
name = "simulator"
loop_number = 1

# This loop is a test loop for the typical AO linear simulator
# DM stream => delay -> MVM -> camera simulator ==> WFS

[[dataloads]]
source = "sim_matrix_flat1.fits"
target = "aol1_simu_modes"

[compute_units.delay]
exec = 'milk-fpsexec-mem-streamdelay'

[compute_units.delay.fps]
in_name = 'dmvolt'
out_name = 'dmvolt_delayed'
procinfo.loopcntMax = -1
delaysec = 0.033

[compute_units.mvm]
exec = 'milk-fpsexec-linalg-MVMextract'

[compute_units.mvm.fps]
procinfo.enabled = true
procinfo.loopcntMax = -1
procinfo.triggermode = 3
procinfo.triggersname = 'dmvolt_delayed'
GPUindex = 99
insname = 'dmvolt_delayed'
immodes = 'aol{loop_number}_simu_modes' # todo reinterpret as f-string
axmode = 1
option.MODENORM = false
outcoeff = 'wfssim_clean'

[compute_units.wfscamsim]
exec = 'cacao-fpsexec-cacaoiot-wfscamsim'

[compute_units.wfscamsim.fps]
procinfo.triggersname = '{compute_units.mvm.fps.outcoeff}'
wfssignal = '{compute_units.mvm.fps.outcoeff}'
wfscamim = 'wfssim'
procinfo.enabled = true
procinfo.loopcntMax = -1
procinfo.triggermode = 3
