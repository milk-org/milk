# mlat and measlinresp over a simulated DM -> WFS path.
#
#   dm07disp00..11 --[dmcomb]--> dm07disp --[dmdelay: streamdelay, +delaysec]--> mlatsim_dmdelayed
#      02 = RM pokes                                                                   |
#      03 = loop                                     [wfscam: streamcopy, fixed ~1 kHz clock]
#      10 = dmturb (on demand)                                                         v
#                                                                                mlatsim_wfs
#
# The camera samples the delayed DM on its own clock; DM writes never trigger it.
long_name = "mlatsim"
name = "mlatsim"
loop_number = 7
teardown_kill_tmux = true
runstart = ["dmcomb", "dmdelay", "wfscam"]  # dmturb: on demand

[[hooks]]                     # writes data/dm.fits: 16x16 float32 zeros
id = "dm"
type = "command"
command = ["python3", "../scripts/mkdm.py", "dm.fits"]
product = "dm.fits"

[[dataloads]]                 # every stream exists before any CompU starts
source = "dm.fits"
target = "dm07disp"

[[dataloads]]
source = "dm.fits"
target = "dm07disp02"

[[dataloads]]
source = "dm.fits"
target = "dm07disp03"

[[dataloads]]
source = "dm.fits"
target = "dm07disp10"

[[dataloads]]
source = "dm.fits"
target = "mlatsim_dmdelayed"

[[dataloads]]
source = "dm.fits"
target = "mlatsim_wfs"

[compute_units.dmcomb]        # the DM: sums its 12 channels into dm07disp; creates the others
exec = "cacao-fpsexec-dmcomb"

[compute_units.dmcomb.fps]
DMindex = 7
DMxsize = 16
DMysize = 16
NBchannel = 12
DMcombout = "dm07disp"
procinfo.enabled = true
procinfo.loopcntMax = -1
procinfo.triggermode = 4      # delay: polls the channels' counters
procinfo.triggerdelay = 0.00001   # cacao's value

[compute_units.dmturb]        # turbulence into channel 10; turbON through the FPS
exec = "cacao-fpsexec-dmturb"

[compute_units.dmturb.fps]
dmstream = "dm07disp10"       # cacao's turbulence channel
turbON = false
DMpixscale = 0.5             # [m/actuator]; dmturb's defaults are all 0 (unusable)
wspeed = 10.0                 # [m/s]
wangle = 0.0                  # [rad]
ampl = 0.1                    # RMS across the DM [um]
turbseed.size = 512           # seed screen, computed into rootdir/conf/turbseed{0,1}.fits on
turbseed.pixscale = 0.1       # the first run start [m/pix]
turbseed.innerscale = 0.01    # [m]
turbseed.outerscale = 20.0    # [m]
procinfo.enabled = true
procinfo.loopcntMax = -1
procinfo.triggermode = 4
procinfo.triggerdelay = 0.001

[compute_units.dmdelay]       # the DM response: copies each DM write, delaysec late
exec = "milk-fpsexec-mem-streamdelay"

[compute_units.dmdelay.fps]
in_name = "dm07disp"
out_name = "mlatsim_dmdelayed"
delaysec = 0.003
naive_mode = false            # time-stamped buffer: every DM write comes out, delaysec late
procinfo.enabled = true
procinfo.loopcntMax = -1
procinfo.triggermode = 4      # delay: polls the buffer every triggerdelay
procinfo.triggerdelay = 0.000005

[compute_units.wfscam]        # the camera: one frame every triggerdelay
exec = "milk-fpsexec-mem-streamcopy"

[compute_units.wfscam.fps]
in_sname = "{compute_units.dmdelay.fps.out_name}"
out_sname = "mlatsim_wfs"
procinfo.enabled = true
procinfo.loopcntMax = -1
procinfo.triggermode = 4      # delay
procinfo.triggerdelay = 0.001
