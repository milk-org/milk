long_name = "aoloop"
name = "aoloop"
loop_number = 0
teardown_kill_tmux = true
runstart = ["acquWFS", "wfs2modes", "mfilt", "modes2dm"]  # mlat, measlinresp: on demand
_ln = '{loop_number}' # alias

includes = ["fpsdetails.toml"]

[dmhint]  # mlatsim_dm, until a real DM
xsize = 16
ysize = 16
beam_xcent = 7.5
beam_ycent = 7.5
beam_rad = 8.0

[compute_units]
acquWFS.exec   = 'cacao-fpsexec-cacaoiot-acqWFS'
wfs2modes.exec = 'milk-fpsexec-linalg-MVMextract'
mfilt.exec     = 'cacao-fpsexec-mfilt'
modes2dm.exec  = 'milk-fpsexec-linalg-MVMextract'

mlat.exec      = 'cacao-fpsexec-cacaopt-mlat'
measlinresp.exec    = 'cacao-fpsexec-cacaoac-measlinresp'


[systemlinkage.delaysim]
aol0_wfsim = 'mlatsim_wfs'
aol0_dmC = 'mlatsim_dm'
aol0_dmRM = 'mlatsim_dm'        # same destination as dmC, for now # FIXME
