# Real-time placement of a milk unit run by the system manager (example, see
# docs/operations/systemd.md). With milk-unit@.service in /etc/systemd/system, copy this file to
# /etc/systemd/system/milk-unit@NAME.service.d/rt.conf and adapt it. A user manager cannot do this:
# its real-time priority limit is 0, and it is not given every cgroup controller.

[Service]
# the owner of the FPS: a unit always runs as its owner
User=aouser
# the CPUs and memory of the loop: .procinfo.cset is skipped under systemd
AllowedCPUs=4-7
NUMAPolicy=local
CPUSchedulingPolicy=fifo
CPUSchedulingPriority=80
LimitRTPRIO=99
LimitMEMLOCK=infinity
